<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
  </defs>

  <rect width="1100" height="480" fill="url(#bgLoop)" rx="16" />

  <!-- Header -->
  <text x="550" y="42" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">THE CONTINUOUS LOOP</text>
  <text x="550" y="75" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">End-to-End Agentic Development Cycle</text>
  <text x="550" y="100" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13.5">Eliminating hallucinations and code rot at each stage</text>

  <!-- Step 1: Ground -->
  <g transform="translate(40, 140)">
    <rect width="180" height="240" rx="14" fill="#042017" stroke="#10b981" stroke-width="1.6" />
    <circle cx="90" cy="40" r="22" fill="#064e3b" />
    <text x="90" y="47" text-anchor="middle" font-size="20">⚡</text>
    <text x="90" y="80" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STAGE 1</text>
    <text x="90" y="104" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Ground</text>
    <text x="90" y="130" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">Context7</text>
    <text x="90" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Fetch current docs</text>
    <text x="90" y="180" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Zero API guessing</text>
    <text x="90" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Framework specs</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(225, 250)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <polygon points="25,-6 35,0 25,6" fill="#38bdf8" />
  </g>

  <!-- Step 2: Spec -->
  <g transform="translate(265, 140)">
    <rect width="180" height="240" rx="14" fill="#241403" stroke="#f59e0b" stroke-width="1.6" />
    <circle cx="90" cy="40" r="22" fill="#451a03" />
    <text x="90" y="47" text-anchor="middle" font-size="20">📋</text>
    <text x="90" y="80" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STAGE 2</text>
    <text x="90" y="104" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Interrogate</text>
    <text x="90" y="130" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="11">/grill-with-docs</text>
    <text x="90" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Interview prompt</text>
    <text x="90" y="180" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Define glossary</text>
    <text x="90" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Produce /to-spec</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(450, 250)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <polygon points="25,-6 35,0 25,6" fill="#38bdf8" />
  </g>

  <!-- Step 3: Implement & TDD -->
  <g transform="translate(490, 140)">
    <rect width="180" height="240" rx="14" fill="#1b1735" stroke="#6366f1" stroke-width="1.6" />
    <circle cx="90" cy="40" r="22" fill="#312e81" />
    <text x="90" y="47" text-anchor="middle" font-size="20">⚙️</text>
    <text x="90" y="80" text-anchor="middle" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STAGE 3</text>
    <text x="90" y="104" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">TDD Flow</text>
    <text x="90" y="130" text-anchor="middle" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="11">/tdd • /implement</text>
    <text x="90" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Red-Green-Refactor</text>
    <text x="90" y="180" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Modular tickets</text>
    <text x="90" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Minimal diff chunks</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(675, 250)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <polygon points="25,-6 35,0 25,6" fill="#38bdf8" />
  </g>

  <!-- Step 4: Verify -->
  <g transform="translate(715, 140)">
    <rect width="180" height="240" rx="14" fill="#1c0e2c" stroke="#a855f7" stroke-width="1.6" />
    <circle cx="90" cy="40" r="22" fill="#3b0764" />
    <text x="90" y="47" text-anchor="middle" font-size="20">🎭</text>
    <text x="90" y="80" text-anchor="middle" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="11" font-weight="700">STAGE 4</text>
    <text x="90" y="104" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">Verify</text>
    <text x="90" y="130" text-anchor="middle" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="11">Playwright MCP</text>
    <text x="90" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">A11y tree lookup</text>
    <text x="90" y="180" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Deterministic clicks</text>
    <text x="90" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Automated validation</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(900, 250)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <polygon points="25,-6 35,0 25,6" fill="#38bdf8" />
  </g>

  <!-- Step 5: Wayfinder -->
  <g transform="translate(935, 140)">
    <rect width="125" height="240" rx="14" fill="#0c1a2e" stroke="#0284c7" stroke-width="1.6" />
    <circle cx="62" cy="40" r="22" fill="#0369a1" />
    <text x="62" y="47" text-anchor="middle" font-size="20">🧭</text>
    <text x="62" y="80" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">STAGE 5</text>
    <text x="62" y="104" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Navigate</text>
    <text x="62" y="130" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10">/wayfinder</text>
    <text x="62" y="160" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Codebase</text>
    <text x="62" y="180" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">mapping &amp;</text>
    <text x="62" y="200" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">next steps</text>
  </g>

  <!-- Return Loop arrow -->
  <path d="M 997 385 C 997 435, 130 435, 130 385" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" fill="none" />
  <polygon points="125,395 130,380 135,395" fill="#38bdf8" />
  <text x="550" y="425" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Continuous Iteration Loop</text>
</svg>
